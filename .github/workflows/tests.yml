name: Tests

on:
  push:
  pull_request:

jobs:
  mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r mcp-server/requirements-dev.txt
      - run: pytest
        working-directory: mcp-server

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements-dev.txt
      - run: pytest
        working-directory: scripts
